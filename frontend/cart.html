<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart — NOVA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #ffffff;
            color: #111111;
        }

        .cart-nav {
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 0;
        }

        .cart-nav-inner {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: #111;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-actions a {
            text-decoration: none;
            color: #111;
            font-size: 14px;
        }

        .cart-page {
            max-width: 1000px;
            margin: auto;
            padding: 55px 20px 80px;
        }

        .cart-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 40px;
            align-items: start;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 130px 1fr auto;
            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #e5e5e5;
        }

        .cart-item-image {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-item-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .cart-item-category {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .cart-item-price {
            font-size: 15px;
            margin-bottom: 15px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;

            border: 1px solid #222;
            background: white;

            border-radius: 5px;

            cursor: pointer;
        }

        .quantity-btn:hover {
            background: #111;
            color: white;
        }

        .remove-btn {
            border: none;
            background: none;
            color: #777;
            font-size: 13px;
            cursor: pointer;
        }

        .remove-btn:hover {
            color: #000;
            text-decoration: underline;
        }

        .item-total {
            font-weight: 600;
            font-size: 16px;
        }

        .summary {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 25px;

            position: sticky;
            top: 90px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .summary-total {
            border-top: 1px solid #e5e5e5;

            padding-top: 18px;
            margin-top: 20px;

            display: flex;
            justify-content: space-between;

            font-size: 19px;
            font-weight: 700;
        }

        .checkout-btn {
            width: 100%;
            border: none;

            background: #20252a;
            color: white;

            padding: 14px;

            border-radius: 25px;

            margin-top: 25px;

            font-weight: 600;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #000;
        }

        .continue-btn {
            display: block;
            text-align: center;

            margin-top: 15px;

            color: #111;
            text-decoration: none;

            font-size: 14px;
        }

        .continue-btn:hover {
            text-decoration: underline;
        }

        .empty-cart {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 12px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .loading {
            text-align: center;
            padding: 80px;
        }

        @media (max-width: 768px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

            .cart-item {
                grid-template-columns: 90px 1fr;
            }

            .cart-item-image {
                width: 90px;
                height: 90px;
            }

            .item-total {
                grid-column: 2;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="cart-nav">

        <div class="cart-nav-inner">

            <a
                href="index.html"
                class="brand">
                NOVA
            </a>


            <div class="nav-actions">

                <a href="index.html">
                    Shop
                </a>

                <a href="#">
                    ♡
                </a>

                <a href="cart.html">
                    🛒
                    <span id="cartCount">0</span>
                </a>

            </div>

        </div>

    </nav>



    <!-- CART PAGE -->

    <main class="cart-page">


        <h1 class="cart-title">
            Your Cart
        </h1>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading">

            <div
                class="spinner-border"
                role="status">
            </div>

            <p class="mt-3">
                Loading cart...
            </p>

        </div>



        <!-- EMPTY CART -->

        <div
            id="emptyCart"
            class="empty-cart"
            style="display:none;">

            <h2>
                Your cart is empty
            </h2>

            <p>
                Looks like you haven't added anything yet.
            </p>

            <a
                href="index.html"
                class="btn btn-dark">

                Continue Shopping

            </a>

        </div>



        <!-- CART -->

        <div
            id="cartContent"
            style="display:none;">

            <div class="cart-layout">


                <!-- ITEMS -->

                <div id="cartItems">
                </div>



                <!-- SUMMARY -->

                <div class="summary">

                    <div class="summary-title">
                        Order Summary
                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Shipping
                        </span>

                        <span id="shipping">
                            FREE
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Tax
                        </span>

                        <span id="tax">
                            ₹0
                        </span>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>


                    <button
                        id="checkoutBtn"
                        class="checkout-btn">

                        Proceed to Checkout

                    </button>


                    <a
                        href="index.html"
                        class="continue-btn">

                        ← Continue Shopping

                    </a>

                </div>

            </div>

        </div>

    </main>



    <script>

        const API_BASE =
            "http://127.0.0.1:8000";


        const loading =
            document.getElementById("loading");

        const emptyCart =
            document.getElementById("emptyCart");

        const cartContent =
            document.getElementById("cartContent");

        const cartItems =
            document.getElementById("cartItems");

        const cartCount =
            document.getElementById("cartCount");

        const subtotalElement =
            document.getElementById("subtotal");

        const taxElement =
            document.getElementById("tax");

        const totalElement =
            document.getElementById("total");

        const checkoutBtn =
            document.getElementById("checkoutBtn");



        // ==========================================
        // FORMAT PRICE
        // ==========================================

        function formatPrice(price) {

            return `₹${Number(price).toLocaleString("en-IN")}`;

        }



        // ==========================================
        // LOAD CART
        // ==========================================

        async function loadCart() {

            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/cart`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load cart"
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Cart:",
                    data
                );


                loading.style.display =
                    "none";


                // ==================================
                // EMPTY
                // ==================================

                if (
                    !data.items ||
                    data.items.length === 0
                ) {

                    emptyCart.style.display =
                        "block";

                    cartContent.style.display =
                        "none";

                    cartCount.textContent =
                        "0";

                    return;
                }


                // ==================================
                // SHOW CART
                // ==================================

                cartContent.style.display =
                    "block";


                renderCart(data);


            } catch (error) {

                console.error(
                    "Cart error:",
                    error
                );


                loading.innerHTML = `
                    <p>
                        Unable to load cart.
                    </p>
                `;

            }

        }



        // ==========================================
        // RENDER CART
        // ==========================================

        function renderCart(data) {

            cartItems.innerHTML = "";


            let totalItems = 0;


            data.items.forEach(function(item) {

                totalItems +=
                    Number(item.quantity);


                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);


                const itemHTML = `

                    <div
                        class="cart-item"
                        data-product-id="${item.product_id}">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                            class="cart-item-image"
                        >


                        <div>

                            <div class="cart-item-category">
                                ${item.category || ""}
                            </div>

                            <div class="cart-item-name">
                                ${item.name}
                            </div>

                            <div class="cart-item-price">
                                ${formatPrice(item.price)}
                            </div>


                            <div class="quantity-controls">

                                <button
                                    class="quantity-btn minus"
                                    data-id="${item.product_id}">
                                    −
                                </button>

                                <span>
                                    ${item.quantity}
                                </span>

                                <button
                                    class="quantity-btn plus"
                                    data-id="${item.product_id}">
                                    +
                                </button>


                                <button
                                    class="remove-btn"
                                    data-id="${item.product_id}">
                                    Remove
                                </button>

                            </div>

                        </div>


                        <div class="item-total">
                            ${formatPrice(itemTotal)}
                        </div>

                    </div>

                `;


                cartItems.insertAdjacentHTML(
                    "beforeend",
                    itemHTML
                );

            });


            cartCount.textContent =
                totalItems;


            // ==================================
            // TOTALS
            // ==================================

            const subtotal =
                Number(data.total || 0);


            const tax =
                Math.round(subtotal * 0.05);


            const total =
                subtotal + tax;


            subtotalElement.textContent =
                formatPrice(subtotal);


            taxElement.textContent =
                formatPrice(tax);


            totalElement.textContent =
                formatPrice(total);


            attachCartEvents();

        }



        // ==========================================
        // CART BUTTON EVENTS
        // ==========================================

        function attachCartEvents() {


            // PLUS

            document
                .querySelectorAll(".plus")
                .forEach(function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            changeQuantity(
                                Number(
                                    button.dataset.id
                                ),
                                1
                            );

                        }
                    );

                });


            // MINUS

            document
                .querySelectorAll(".minus")
                .forEach(function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            changeQuantity(
                                Number(
                                    button.dataset.id
                                ),
                                -1
                            );

                        }
                    );

                });


            // REMOVE

            document
                .querySelectorAll(".remove-btn")
                .forEach(function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            removeItem(
                                Number(
                                    button.dataset.id
                                )
                            );

                        }
                    );

                });

        }



        // ==========================================
        // CHANGE QUANTITY
        // ==========================================

        async function changeQuantity(
            productId,
            change
        ) {

            try {

                const cartResponse =
                    await fetch(
                        `${API_BASE}/api/cart`
                    );


                const cart =
                    await cartResponse.json();


                const item =
                    cart.items.find(
                        function(item) {

                            return Number(
                                item.product_id
                            ) === productId;

                        }
                    );


                if (!item) {
                    return;
                }


                const newQuantity =
                    Number(item.quantity) +
                    change;


                if (newQuantity <= 0) {

                    await removeItem(
                        productId
                    );

                    return;
                }


                const response =
                    await fetch(
                        `${API_BASE}/api/cart`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                product_id:
                                    productId,

                                quantity:
                                    newQuantity

                            })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not update quantity"
                    );

                }


                loadCart();


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Could not update quantity."
                );

            }

        }



        // ==========================================
        // REMOVE ITEM
        // ==========================================

        async function removeItem(
            productId
        ) {

            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/cart/${productId}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not remove item"
                    );

                }


                loadCart();


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Could not remove item."
                );

            }

        }



        // ==========================================
        // CHECKOUT
        // ==========================================

        checkoutBtn.addEventListener(
            "click",
            function() {

                window.location.href =
                    "checkout.html";

            }
        );



        // ==========================================
        // START
        // ==========================================

        loadCart();

    </script>


</body>

</html>
