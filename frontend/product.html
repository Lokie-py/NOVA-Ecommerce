<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product — NOVA</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #ffffff;
            color: #111111;
        }

        .product-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 45px 20px 80px;
        }

        .product-nav {
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 0;
        }

        .product-nav-inner {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: #111;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-actions a {
            text-decoration: none;
            color: #111;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 45px;
            color: #111;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: center;
        }

        .product-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 14px;
            display: block;
            background: #f2f2f2;
        }

        .product-category {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 38px;
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .product-rating {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .product-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .quantity-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #222;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity-btn:hover {
            background: #111;
            color: white;
        }

        #quantity {
            min-width: 20px;
            text-align: center;
        }

        .add-cart-btn {
            border: none;
            background: #20252a;
            color: white;
            border-radius: 25px;
            padding: 13px 32px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-cart-btn:hover {
            background: #000;
        }

        .error-box {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-box {
            text-align: center;
            padding: 100px 20px;
        }

        @media (max-width: 768px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-image {
                height: 350px;
            }

            .product-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="product-nav">
        <div class="product-nav-inner">

            <a href="index.html" class="brand">
                NOVA
            </a>

            <div class="nav-actions">
                <a href="index.html">Shop</a>
                <a href="#">♡</a>

                <a href="cart.html" title="Cart">
                    🛒
                    <span id="cartCount">0</span>
                </a>
            </div>

        </div>
    </nav>


    <!-- PRODUCT PAGE -->
    <main class="product-page">

        <a href="index.html" class="back-link">
            ← Back to Shop
        </a>

        <!-- Loading -->
        <div id="loading" class="loading-box">
            <div class="spinner-border" role="status"></div>
            <p class="mt-3">Loading product...</p>
        </div>


        <!-- Error -->
        <div id="error" class="error-box" style="display:none;">
            <h3>Product not found</h3>
            <p>We couldn't find the product you're looking for.</p>

            <a href="index.html" class="btn btn-dark">
                Back to Shop
            </a>
        </div>


        <!-- Product -->
        <div id="productContent" style="display:none;">

            <div class="product-layout">

                <!-- IMAGE -->
                <div>
                    <img
                        id="productImage"
                        class="product-image"
                        src=""
                        alt="Product"
                    >
                </div>


                <!-- DETAILS -->
                <div>

                    <div
                        id="productCategory"
                        class="product-category">
                    </div>

                    <h1
                        id="productName"
                        class="product-title">
                    </h1>

                    <div
                        id="productRating"
                        class="product-rating">
                    </div>

                    <div
                        id="productPrice"
                        class="product-price">
                    </div>

                    <p
                        id="productDescription"
                        class="product-description">
                    </p>


                    <!-- QUANTITY -->
                    <div class="quantity-box">

                        <button
                            id="minusBtn"
                            class="quantity-btn">
                            −
                        </button>

                        <span id="quantity">1</span>

                        <button
                            id="plusBtn"
                            class="quantity-btn">
                            +
                        </button>

                    </div>


                    <!-- ADD TO CART -->
                    <button
                        id="addToCartBtn"
                        class="add-cart-btn">

                        Add to Cart

                    </button>

                </div>

            </div>

        </div>

    </main>


    <script>

        // ============================================
        // API
        // ============================================

        const API_BASE = "http://127.0.0.1:8000";


        // ============================================
        // GET PRODUCT ID FROM URL
        // Example:
        // product.html?id=1
        // ============================================

        const params = new URLSearchParams(window.location.search);

        const productId = params.get("id");


        // ============================================
        // ELEMENTS
        // ============================================

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const productContent = document.getElementById("productContent");

        const productImage = document.getElementById("productImage");
        const productCategory = document.getElementById("productCategory");
        const productName = document.getElementById("productName");
        const productRating = document.getElementById("productRating");
        const productPrice = document.getElementById("productPrice");
        const productDescription = document.getElementById("productDescription");

        const quantityElement = document.getElementById("quantity");

        const minusBtn = document.getElementById("minusBtn");
        const plusBtn = document.getElementById("plusBtn");
        const addToCartBtn = document.getElementById("addToCartBtn");

        const cartCount = document.getElementById("cartCount");


        // ============================================
        // QUANTITY
        // ============================================

        let quantity = 1;


        plusBtn.addEventListener("click", function () {

            quantity++;

            quantityElement.textContent = quantity;

        });


        minusBtn.addEventListener("click", function () {

            if (quantity > 1) {

                quantity--;

                quantityElement.textContent = quantity;

            }

        });


        // ============================================
        // LOAD PRODUCT
        // ============================================

        async function loadProduct() {

            console.log("Product ID:", productId);

            // No ID
            if (!productId) {

                loading.style.display = "none";
                error.style.display = "block";

                return;
            }


            try {

                console.log(
                    "Fetching:",
                    `${API_BASE}/api/products/${productId}`
                );


                const response = await fetch(
                    `${API_BASE}/api/products/${productId}`
                );


                console.log(
                    "Response status:",
                    response.status
                );


                if (!response.ok) {

                    throw new Error(
                        "Product request failed"
                    );

                }


                const product = await response.json();


                console.log(
                    "Product received:",
                    product
                );


                // ====================================
                // DISPLAY PRODUCT
                // ====================================

                productImage.src = product.image;

                productImage.alt = product.name;

                productCategory.textContent =
                    product.category;

                productName.textContent =
                    product.name;

                productRating.textContent =
                    `★ ${product.rating}`;

                productPrice.textContent =
                    `₹${Number(product.price).toLocaleString("en-IN")}`;

                productDescription.textContent =
                    product.description;


                // ====================================
                // SHOW PRODUCT
                // ====================================

                loading.style.display = "none";

                productContent.style.display = "block";


            } catch (err) {

                console.error(
                    "PRODUCT ERROR:",
                    err
                );


                loading.style.display = "none";

                error.style.display = "block";

            }

        }


        // ============================================
        // ADD TO CART
        // ============================================

        addToCartBtn.addEventListener(
            "click",
            async function () {

                try {

                    addToCartBtn.disabled = true;

                    addToCartBtn.textContent =
                        "Adding...";


                    const response = await fetch(
                        `${API_BASE}/api/cart`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                product_id:
                                    Number(productId),

                                quantity:
                                    quantity

                            })

                        }
                    );


                    const data =
                        await response.json();


                    console.log(
                        "Cart response:",
                        data
                    );


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Could not add to cart"
                        );

                    }


                    addToCartBtn.textContent =
                        "Added ✓";


                    updateCartCount();


                    setTimeout(function () {

                        addToCartBtn.disabled = false;

                        addToCartBtn.textContent =
                            "Add to Cart";

                    }, 1200);


                } catch (err) {

                    console.error(
                        "CART ERROR:",
                        err
                    );


                    alert(
                        "Could not add product to cart."
                    );


                    addToCartBtn.disabled = false;

                    addToCartBtn.textContent =
                        "Add to Cart";

                }

            }
        );


        // ============================================
        // CART COUNT
        // ============================================

        async function updateCartCount() {

            try {

                const response = await fetch(
                    `${API_BASE}/api/cart`
                );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                let totalItems = 0;


                if (data.items) {

                    data.items.forEach(function (item) {

                        totalItems +=
                            Number(item.quantity);

                    });

                }


                cartCount.textContent =
                    totalItems;


            } catch (err) {

                console.log(
                    "Cart count unavailable"
                );

            }

        }


        // ============================================
        // START
        // ============================================

        loadProduct();

        updateCartCount();

    </script>

</body>
</html>
